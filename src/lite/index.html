<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penanda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Baris Navigasi Atas (Tinggi 48px) -->
  <header class="top-bar">
    <div class="top-bar-left">
      <div class="brand-title">Penanda</div>
      <nav class="nav-tabs" role="tablist" aria-label="Modul Penanda">
        <button class="nav-tab-btn active" data-tab="indeks" role="tab" aria-selected="true" aria-controls="panel-indeks">Indeks</button>
        <button class="nav-tab-btn" data-tab="todo" role="tab" aria-selected="false" aria-controls="panel-todo">Todo</button>
        <button class="nav-tab-btn" data-tab="log" role="tab" aria-selected="false" aria-controls="panel-log">Log</button>
      </nav>
    </div>
    <div class="top-bar-right">
      <div id="status-bar" class="status-bar" aria-live="polite">Lite - memuat...</div>
    </div>
  </header>

  <!-- Area Konten Utama -->
  <main class="main-content">
    <!-- Panel Indeks -->
    <section id="panel-indeks" class="tab-panel active" role="tabpanel" aria-labelledby="tab-indeks">
      <div class="placeholder-card">
        <h2>Modul Indeks</h2>
        <p>Pencarian, item kerja harian, dan kartu tag akan diimplementasikan pada tiket berikutnya.</p>
      </div>
    </section>

    <!-- Panel Todo -->
    <section id="panel-todo" class="tab-panel" role="tabpanel" aria-labelledby="tab-todo" hidden>
      <div class="placeholder-card">
        <h2>Modul Todo</h2>
        <p>Daftar tugas dengan deadline murah akan diimplementasikan pada Tiket 07.</p>
      </div>
    </section>

    <!-- Panel Log -->
    <section id="panel-log" class="tab-panel" role="tabpanel" aria-labelledby="tab-log" hidden>
      <div class="placeholder-card">
        <h2>Modul Logbook</h2>
        <p>Catatan riwayat kerja harian akan diimplementasikan pada Tiket 08.</p>
      </div>
    </section>
  </main>

  <!-- Skrip dimuat biasa (bukan ES Module) agar kompatibel dengan protokol file:// -->
  <script src="search.js"></script>
  <script src="app.js"></script>
</body>
</html>
